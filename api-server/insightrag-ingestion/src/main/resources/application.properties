spring.application.name=insightrag-ingestion
#Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=event-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.hieulc.insightragingestion.dto.EventMessage
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
#InsightRAG config
insightrag.kafka.topics.consumer=rag-extracting-topic
insightrag.graph.ingestion.batch-size=1000
#Neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4jpassword
#Minio
minio.endpoint=http://127.0.0.1:9000
minio.credentials.username=minioadmin
minio.credentials.password=miniopassword
minio.bucket.exchange.name=minio_buckets_events
minio.bucket.exchange.type=direct
#neo4j migration
org.neo4j.migrations.enabled=true