spring.application.name=insightrag-worker

spring.datasource.url=jdbc:postgresql://localhost:5432/insightrag_db
spring.datasource.username=insightrag
spring.datasource.password=insightrag
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=worker_schema
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

#spring.rabbitmq.listener.simple.concurrency=2
#spring.rabbitmq.listener.simple.max-concurrency=2

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#logging.level.org.flywaydb=DEBUG
#logging.level.org.springframework.amqp=DEBUG
#logging.level.org.springframework.transaction=DEBUG
#logging.level.org.hibernate.SQL=DEBUG

#management.endpoints.web.exposure.include=beans

spring.rabbitmq.username=rabbitmq
spring.rabbitmq.password=rabbitmq

minio.endpoint=http://127.0.0.1:9000
minio.credentials.username=minioadmin
minio.credentials.password=miniopassword
minio.bucket.exchange.name=minio_buckets_events
minio.bucket.exchange.type=direct

insightrag.file-uploaded.allowed-content-types[0]=application/pdf
insightrag.file-uploaded.allowed-content-types[1]=application/vnd.openxmlformats-officedocument.wordprocessingml.document
insightrag.file-uploaded.allowed-content-types[2]=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
insightrag.file-uploaded.max-file-size-mb=50
insightrag.file-uploaded.e-tag-threshold-mb=16

debezium.outbox.bootstrap-servers=localhost:9092
debezium.outbox.offset-storage=org.apache.kafka.connect.storage.KafkaOffsetBackingStore
debezium.outbox.offset-storage-topic=rag-debezium-offset-topic
debezium.outbox.offset-storage-partitions=3
debezium.outbox.offset-storage-replication-factor=1

debezium.outbox.database-hostname=localhost
debezium.outbox.database-port=5432
debezium.outbox.database-user=insightrag
debezium.outbox.database-password=insightrag
debezium.outbox.database-name=insightrag_db

debezium.outbox.max-queue-size=4
debezium.outbox.max-batch-size=2

insightrag.kafka.topics.outbox-event=rag-cdc-topic
insightrag.kafka.topics.dlq=rag-dlq-topic
insightrag.kafka.topics.debezium-offset=rag-debezium-offset-topic

