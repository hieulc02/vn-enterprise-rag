org.neo4j.migrations.locations-to-scan=classpath:neo4j/migrations
app.test.neo4j.test-fixtures=classpath:test-fixtures/seed-retrieval-data.cypher
#neo4j
insightrag.neo4j.search.tuning.rrf-constant=60
insightrag.neo4j.search.tuning.weight-fullText=1.0
insightrag.neo4j.search.tuning.weight-vector=1.0
insightrag.neo4j.search.tuning.min-vector-score=0.8
#rate-limit
insightrag.rate-limit.capacity=3
insightrag.rate-limit.refill-tokens=3
insightrag.rate-limit.refill-duration=1m
insightrag.rate-limit.cache-max-size=50000
insightrag.rate-limit.cache-ttl=2m