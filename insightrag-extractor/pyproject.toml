[project]
name = "insightrag-extractor"
version = "0.1.0"
description = "Python worker for document processing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.110.0",
    "docling-core[chunking]>=2.86.0",
    "minio",
    "pydantic-settings",
    "pydantic>=2.13.4",
    "pymupdf",
    "llama-cloud>=2.1",
    "orjson>=3.10,<4.0",
    "google-genai>=2.9.0",
    "langchain-text-splitters>=1.1.2",
    "protobuf>=7.35.1",
    "sentencepiece",
    "numpy>=2.5.1",
    "rapidocr-onnxruntime>=1.4.4",
    "aiofiles>=25.1.0",
    "babel>=2.18.0",
    "unidecode>=1.4.0",
    "pandas>=3.0.3",
    "sentence-transformers>=5.7.0",
    "aiokafka>=0.14.0",
    "diskcache>=5.6.3",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
]

[dependency-groups]
dev = [
    "deptry>=0.23.0",
    "faker>=40.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.15.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "app"
]
testpaths = ["tests"]


[tool.deptry]
known_first_party = [
    "app", "chunking", "config", "embedding", "extraction",
    "llm", "messaging", "models", "parsers", "pipeline",
    "prompts", "storage", "tokenizer", "utils"
]
package_module_name_map = { google-genai = "google" }

[tool.deptry.per_rule_ignores]
DEP002 = ["rapidocr-onnxruntime", "torch", "torchvision"]