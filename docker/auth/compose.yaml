services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: insightrag-keycloak
    profiles: [ retrieval ]
    restart: on-failure
    command: start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_HOSTNAME_URL=http://localhost:9090
      - KC_DB_URL=jdbc:postgresql://postgres-db:5432/keycloak_db
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_MANAGEMENT_HEALTH_ENABLED=true
    ports:
      - "9090:8080"
    env_file:
      - ../.env
    volumes:
      - ../auth/keycloak:/opt/keycloak/data/import
    networks:
      - insightrag_net
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'bash', '-c', "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s