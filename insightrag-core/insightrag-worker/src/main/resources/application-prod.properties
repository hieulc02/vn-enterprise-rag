spring.application.name=insightrag-worker
#database
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/insightrag_db}
spring.datasource.username=${POSTGRES_USERNAME:insightrag}
spring.datasource.password=${POSTGRES_PASSWORD:insightrag}
spring.datasource.driver-class-name=org.postgresql.Driver
#hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=worker_schema
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
#rabbitmq
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rabbitmq}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq}
#kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost:9092}
#replicate across the cluster
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
#force Kafka to assign a sequence number to every message
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#minio
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.credentials.username=${MINIO_USERNAME:minioadmin} CREDENTIALS_USERNAME
minio.credentials.password=${MINIO_PASSWORD:miniopassword}
minio.bucket.exchange.name=minio_buckets_events
minio.bucket.exchange.type=direct
#application infrastructure configuration
insightrag.file-uploaded.allowed-content-types[0]=application/pdf
insightrag.file-uploaded.max-file-size-mb=50
insightrag.file-uploaded.e-tag-threshold-mb=16
insightrag.rabbitmq.dl-queue=dlq_direct_queue
insightrag.rabbitmq.dl-exchange=dlx.direct.exchange
insightrag.rabbitmq.dl-routing-key=worker.failed
insightrag.rabbitmq.main-queue=main_direct_queue
insightrag.rabbitmq.main-exchange=main.direct.exchange
insightrag.rabbitmq.main-routing-key=worker.process
insightrag.kafka.topics.outbox-event=rag-cdc-topic
insightrag.kafka.topics.dlq=rag-dlq-topic
insightrag.kafka.topics.debezium-offset=rag-debezium-offset-topic
#debezium
debezium.outbox.bootstrap-servers=${DEBEZIUM_SERVER:localhost:9092}
debezium.outbox.offset-storage=org.apache.kafka.connect.storage.KafkaOffsetBackingStore
debezium.outbox.offset-storage-topic=rag-debezium-offset-topic
debezium.outbox.offset-storage-partitions=3
debezium.outbox.offset-storage-replication-factor=1
debezium.outbox.database-hostname=${DEBEZIUM_DB_HOST:localhost}
debezium.outbox.database-port=${DEBEZIUM_DB_PORT:5432}
debezium.outbox.database-user=${DEBEZIUM_DB_USER:insightrag}
debezium.outbox.database-password=${DEBEZIUM_DB_PASSWORD:insightrag}
debezium.outbox.database-name=insightrag_db
debezium.outbox.max-queue-size=4
debezium.outbox.max-batch-size=2
#HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
#healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
#logging level to prevent framework noise
logging.level.root=WARN
logging.level.com.hieulc.insightragworker=INFO

