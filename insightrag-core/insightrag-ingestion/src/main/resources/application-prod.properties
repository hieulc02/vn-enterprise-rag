spring.application.name=insightrag-ingestion
#Kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost:9092}
spring.kafka.consumer.group-id=event-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.hieulc.insightragingestion.dto.kafka.EventMessage
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
#application infrastructure config
insightrag.kafka.topics.consumer=${KAFKA_TOPIC_CONSUMER:rag-extracting-topic}
insightrag.kafka.topics.final-dlq=rag-dlq-topic
insightrag.graph.ingestion.batch-size=${INGESTION_BATCH_SIZE:1000}
#Neo4j
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4jpassword}
#Minio
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.credentials.username=${MINIO_USERNAME:minioadmin}
minio.credentials.password=${MINIO_PASSWORD:miniopassword}
minio.bucket.exchange.name=minio_buckets_events
minio.bucket.exchange.type=direct
#database
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/insightrag_db}
spring.datasource.username=${POSTGRES_USERNAME:insightrag}
spring.datasource.password=${POSTGRES_PASSWORD:insightrag}
spring.datasource.driver-class-name=org.postgresql.Driver
#neo4j migration
org.neo4j.migrations.enabled=true
#spring lifecycle
spring.lifecycle.timeout-per-shutdown-phase=30s
#health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
#logging level to prevent framework noise
logging.level.root=WARN
logging.level.com.hieulc.insightragingestion=INFO