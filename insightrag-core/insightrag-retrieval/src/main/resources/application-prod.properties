spring.application.name=insightrag-retrieval
#application embedding
insightrag.embedding.infinity-url=${EMBEDDING_SERVICE_URL:http://localhost:8081}
insightrag.embedding.model=AITeamVN/Vietnamese_Embedding
insightrag.embedding.timeout-in-seconds=180
#application LLM model service
insightrag.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
insightrag.ai.gemini.model-main=gemini-3-flash-preview
insightrag.ai.gemini.model-lite=gemini-3.5-flash-lite
insightrag.ai.gemini.model-tokenizer=gemini-3-pro-preview
insightrag.ai.gemini.api-key=${GEN_AI_API_KEY:mock-api-key}
insightrag.ai.gemini.query-limit-token=1500
insightrag.ai.gemini.max-history-token=3000
insightrag.ai.gemini.fallback.input-limit=32000
insightrag.ai.gemini.fallback.output-limit=8192
insightrag.ai.gemini.memory.max-session=5000
insightrag.ai.gemini.memory.ttl-minutes=60
#application chat context fusion
insightrag.context.retrieval-timeout-seconds=60
insightrag.context.active-strategy=HYBRID
insightrag.context.strategies.HYBRID.chunk-limit=3
insightrag.context.strategies.HYBRID.node-limit=3
insightrag.context.strategies.HYBRID.relationship-limit=3
insightrag.context.strategies.DOCUMENT_HEAVY.chunk-limit=5
insightrag.context.strategies.DOCUMENT_HEAVY.node-limit=1
insightrag.context.strategies.DOCUMENT_HEAVY.relationship-limit=1
#Neo4j
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4jpassword}
org.neo4j.migrations.enabled=false
#Neo4j custom
insightrag.neo4j.search.tuning.rrf-constant=60
insightrag.neo4j.search.tuning.weight-fullText=1.0
insightrag.neo4j.search.tuning.weight-vector=1.0
insightrag.neo4j.search.tuning.min-vector-score=0.85
insightrag.neo4j.search.tuning.edge-semantic-guardrail=0.40
#transactional
spring.transaction.default-timeout=60
#security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:9090/realms/insightrag}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:9090/realms/insightrag/protocol/openid-connect/certs}
#keycloak
keycloak.realm=insightrag
#rate-limit
insightrag.rate-limit.capacity=100
insightrag.rate-limit.refill-tokens=100
insightrag.rate-limit.refill-duration=1m
insightrag.rate-limit.cache-max-size=50000
insightrag.rate-limit.cache-ttl=1h
#cors
insightrag.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
#spring lifecycle
spring.lifecycle.timeout-per-shutdown-phase=30s
#healthcheck
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
#logging level to prevent framework noise
logging.level.root=WARN
logging.level.com.hieulc.insightragretrieval=INFO


